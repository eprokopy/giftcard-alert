name: Check gift card availability

on:
  schedule:
    - cron: "0 9 * * *"    # once a day at 09:00 UTC
  workflow_dispatch: {}     # lets you also trigger it manually from the Actions tab

permissions:
  contents: write            # needed so the workflow can commit status.json back

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests playwright
          playwright install --with-deps chromium

      - name: Run watcher
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          COUNTRIES: ${{ vars.COUNTRIES }}
        run: python giftcard_watcher.py

      - name: Commit updated status file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add status.json
          git diff --quiet --cached || git commit -m "Update status"
          git push